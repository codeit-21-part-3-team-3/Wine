version: '3.8'
services:
  wine-app:
    image: ghcr.io/codeit-21-part-3-team-3/wine:${WINE_IMAGE_TAG:-latest}
    container_name: wine-next-service
    restart: unless-stopped
    ports:
      - '2133:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./next-cache:/app/.next/cache
