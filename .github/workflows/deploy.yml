name: Wine Service CI

on:
  push:
    branches: ['develop']

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npm run type-check

      - name: 린트 검사
        run: npm run lint

      - name: 빌드 확인
        run: npm run build
